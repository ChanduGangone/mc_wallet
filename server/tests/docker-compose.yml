services:
  postgres_test:
    image: postgres:16-alpine
    container_name: mc_wallet_postgres_test
    environment:
      POSTGRES_USER: mc_wallet
      POSTGRES_PASSWORD: mc_wallet
      POSTGRES_DB: mc_wallet_test
    ports:
      - "5436:5432"
    volumes:
      - mc_wallet_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mc_wallet_pg_test_data:
