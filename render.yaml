databases:
  - name: mc-wallet-db
    databaseName: mc_wallet
    user: mc_wallet
    plan: free

services:
  - name: mc-wallet-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mc-wallet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "2097152"
      - key: FRANKFURTER_BASE_URL
        value: https://api.frankfurter.dev/v1
      - key: EXCHANGE_RATE_BASE_CURRENCY
        value: USD
      - key: RATE_STALENESS_HOURS
        value: "36"
      - key: EXCHANGE_RATE_REFRESH_HOUR_UTC
        value: "2"
      # Predicted from this file's frontend service name below
      # (https://<name>.onrender.com). If Render assigns a different
      # hostname (e.g. the name was taken), update this after first deploy.
      - key: CORS_ALLOWED_ORIGINS
        value: https://mc-wallet-frontend.onrender.com

  - name: mc-wallet-frontend
    type: web
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    envVars:
      # Predicted from the backend service name above — same caveat as CORS_ALLOWED_ORIGINS.
      - key: VITE_API_BASE_URL
        value: https://mc-wallet-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
