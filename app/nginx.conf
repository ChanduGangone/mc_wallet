server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # vue-router runs in history mode — fall back to index.html for any
    # non-file path so client-side routes (e.g. /dashboard) don't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
