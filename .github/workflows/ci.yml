name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      # Test-only value — conftest.py overrides DATABASE_URL itself, but
      # JWT_SECRET_KEY has no default and there's no .env file in CI.
      JWT_SECRET_KEY: ci-test-only-secret-not-used-in-production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mc_wallet
          POSTGRES_PASSWORD: mc_wallet
          POSTGRES_DB: mc_wallet_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U mc_wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - name: Run backend test suite
        working-directory: server
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build
